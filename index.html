  <script>
  (function () {
    "use strict";
    var payloadElement = document.getElementById("locked-payload");
    var form = document.getElementById("unlock-form");
    var passwordInput = document.getElementById("password");
    var showPassword = document.getElementById("show-password");
    var button = document.getElementById("unlock-button");
    var status = document.getElementById("unlock-status");
    var fileName = document.getElementById("locked-file-name");
    var customLogo = document.querySelector(".mark.custom img");
    var payload;

    if (customLogo) customLogo.addEventListener("error", function () {
      customLogo.style.display = "none";
      var fallback = customLogo.nextElementSibling;
      if (fallback) fallback.style.display = "grid";
    });

    function base64ToBytes(value) {
      var binary = atob(value);
      var bytes = new Uint8Array(binary.length);
      for (var index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function bytesToHex(bytes) {
      var result = "";
      for (var index = 0; index < bytes.length; index += 1) result += bytes[index].toString(16).padStart(2, "0");
      return result;
    }

    async function sha256Hex(bytes) {
      return bytesToHex(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)));
    }

    async function deriveKey(password, salt) {
      var material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: payload.kdf.iterations, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    function collectScripts(parsed) {
      var descriptors = [];
      var scripts = Array.from(parsed.querySelectorAll("script"));
      scripts.forEach(function (script, index) {
        var marker = parsed.createElement("template");
        marker.setAttribute("data-unlock-script", String(index));
        descriptors.push({
          attributes: Array.from(script.attributes).map(function (attribute) { return [attribute.name, attribute.value]; }),
          text: script.textContent || ""
        });
        script.replaceWith(marker);
      });
      return descriptors;
    }

    async function restoreScripts(descriptors) {
      for (var index = 0; index < descriptors.length; index += 1) {
        var descriptor = descriptors[index];
        var marker = document.querySelector('template[data-unlock-script="' + index + '"]');
        if (!marker) continue;
        var script = document.createElement("script");
        descriptor.attributes.forEach(function (attribute) { script.setAttribute(attribute[0], attribute[1]); });
        script.textContent = descriptor.text;
        var waitsForLoad = script.hasAttribute("src") || script.getAttribute("type") === "module";
        var completion = waitsForLoad ? new Promise(function (resolve) {
          script.addEventListener("load", resolve, { once: true });
          script.addEventListener("error", resolve, { once: true });
        }) : Promise.resolve();
        marker.replaceWith(script);
        await completion;
      }
    }

    async function activateHtml(html) {
      var parsed = new DOMParser().parseFromString(html, "text/html");
      var descriptors = collectScripts(parsed);
      var imported = document.importNode(parsed.documentElement, true);
      document.replaceChild(imported, document.documentElement);
      await restoreScripts(descriptors);
      document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true }));
      window.dispatchEvent(new Event("load"));
    }

    function fail(message) {
      status.textContent = message;
      status.className = "status error";
      button.disabled = false;
      passwordInput.disabled = false;
      passwordInput.focus();
      passwordInput.select();
    }

    try {
      payload = JSON.parse(payloadElement.textContent);
      if (fileName) fileName.textContent = payload.original.name;
    } catch (error) {
      fail("This encrypted file is damaged or incomplete.");
      return;
    }

    if (!window.crypto || !window.crypto.subtle) {
      fail("Secure browser encryption is unavailable. Open this file in a current browser or from HTTPS/localhost.");
      button.disabled = true;
      return;
    }

    showPassword.addEventListener("change", function () {
      passwordInput.type = showPassword.checked ? "text" : "password";
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!passwordInput.value) return;
      button.disabled = true;
      passwordInput.disabled = true;
      status.className = "status";
      status.textContent = "Deriving the key and decrypting…";
      var salt;
      var iv;
      var encrypted;
      var plain;
      try {
        salt = base64ToBytes(payload.kdf.salt);
        iv = base64ToBytes(payload.cipher.iv);
        encrypted = base64ToBytes(payload.ciphertext);
        var key = await deriveKey(passwordInput.value, salt);
        plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, encrypted));
        var hash = await sha256Hex(plain);
        if (plain.byteLength !== payload.original.size || hash !== payload.original.sha256) throw new Error("Integrity check failed");
        status.textContent = "Verified. Opening protected website…";
        var html = new TextDecoder("utf-8", { fatal: true }).decode(plain);
        passwordInput.value = "";
        salt.fill(0);
        iv.fill(0);
        encrypted.fill(0);
        plain.fill(0);
        await activateHtml(html);
      } catch (error) {
        if (salt) salt.fill(0);
        if (iv) iv.fill(0);
        if (encrypted) encrypted.fill(0);
        if (plain) plain.fill(0);
        fail("Incorrect password or damaged file.");
      }
    });
  }());
  </script>
</body>
